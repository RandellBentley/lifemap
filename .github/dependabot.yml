# Weekly dependency updates. Minor/patch bumps are grouped per ecosystem to keep PR noise low;
# majors arrive individually so their changelogs get read.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { update-types: [minor, patch] }

  - package-ecosystem: pip
    directories: [/backend, /media-processor]
    schedule: { interval: weekly }
    groups:
      python: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm: { update-types: [minor, patch] }

  - package-ecosystem: terraform
    directories: [/infra/bootstrap, /infra/envs/personal, /infra/envs/dev, /infra/envs/prod]
    schedule: { interval: weekly }
    groups:
      terraform: { update-types: [minor, patch] }

  - package-ecosystem: docker
    directories: [/backend, /infra/host]
    schedule: { interval: weekly }
