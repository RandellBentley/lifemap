# Python lint config for backend/ and media-processor/.
line-length = 120
target-version = "py311"
extend-exclude = ["**/migrations/*"]

[lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade, Django-specific checks
select = ["F", "E", "W", "I", "B", "UP", "DJ"]

[lint.isort]
known-first-party = ["accounts", "config", "goals", "journal"]

[lint.per-file-ignores]
# Test assertions read best as one line of expected vs actual; app code keeps the limit.
"**/tests.py" = ["E501"]
