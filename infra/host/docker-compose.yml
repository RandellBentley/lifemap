# Runs on the EC2 host in /opt/lifemap. .env is generated by deploy.sh.
# The ${VAR:-default} values are the production settings; scripts/local-prod.sh
# overrides them to run this same file on your machine.
name: lifemap

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifemap
      POSTGRES_USER: lifemap
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - ${PGDATA_DIR:-/data/postgres}:/var/lib/postgresql/data # separate EBS volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifemap -h 127.0.0.1"] # TCP: the init-time server is socket-only
      interval: 5s
      retries: 20

  web:
    image: ${APP_IMAGE}
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      CLOUDFRONT_PRIVATE_KEY_FILE: /run/secrets/cloudfront_key.pem
    volumes:
      - ${CLOUDFRONT_KEY_FILE:-./cloudfront_key.pem}:/run/secrets/cloudfront_key.pem:ro
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000",
              "--workers", "2", "--timeout", "30", "--forwarded-allow-ips", "*", "--access-logfile", "-"]
    depends_on:
      db: { condition: service_healthy }
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    build:
      context: .
      dockerfile: caddy.Dockerfile
    image: lifemap-caddy
    restart: unless-stopped
    ports: ["${ORIGIN_PORT:-443}:8443"] # Caddy runs as non-root on 8443
    environment:
      ORIGIN_DOMAIN: ${ORIGIN_DOMAIN}
      ORIGIN_VERIFY_SECRET: ${ORIGIN_VERIFY_SECRET}
      ACME_EMAIL: ${ACME_EMAIL}
      AWS_REGION: ${AWS_REGION}
      CADDY_TLS: ${CADDY_TLS:-tls_route53}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates
      - caddy_config:/config
    depends_on: [web]
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
