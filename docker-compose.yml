# Local development: Postgres + an S3 emulator + Django.
# Run the frontend separately with `npm run dev` in frontend/ (it proxies /api to :8000).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: lifemap
      POSTGRES_USER: lifemap
      POSTGRES_PASSWORD: lifemap
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifemap"]
      interval: 2s
      retries: 20

  # SeaweedFS emulates S3 including presigned POST + CORS, and keeps objects on disk
  # (in the s3data volume) so uploads survive restarts.
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -ip.bind=0.0.0.0
    ports: ["9000:8333"]
    volumes:
      - s3data:/data
      - ./infra/local/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      retries: 30

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py ensure_local_bucket &&
             python manage.py runserver 0.0.0.0:8000"
    env_file: backend/.env.example
    environment:
      DATABASE_HOST: db
      AWS_S3_ENDPOINT_URL: http://s3:8333
      AWS_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]
    depends_on:
      db: { condition: service_healthy }
      s3: { condition: service_healthy }

volumes:
  pgdata:
  s3data:
