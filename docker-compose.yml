# Local development: Postgres + an S3 emulator + Django.
# Run the frontend separately with `npm run dev` in frontend/ (it proxies /api to :8000).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: lifemap
      POSTGRES_USER: lifemap
      POSTGRES_PASSWORD: lifemap
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifemap"]
      interval: 2s
      retries: 20

  # Moto emulates S3 including presigned POST + CORS. Host port 9000 because
  # macOS AirPlay Receiver already uses 5000. Data is in-memory only.
  s3:
    image: motoserver/moto:5.2.3
    ports: ["9000:5000"]

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py ensure_local_bucket &&
             python manage.py runserver 0.0.0.0:8000"
    env_file: backend/.env.example
    environment:
      DATABASE_HOST: db
      AWS_S3_ENDPOINT_URL: http://s3:5000
      AWS_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]
    depends_on:
      db: { condition: service_healthy }
      s3: { condition: service_started }

volumes:
  pgdata:
